name: Auto Stock Analysis

on:
  schedule:
    # ══════════════════════════════════════════════════
    # SCHEDULE LOGIC (Bangkok Time → UTC)
    # ══════════════════════════════════════════════════
    
    # ── ตี 5 (22:00 UTC วันก่อน): เก็บราคาปิดตลาด US ──
    # ตลาด US ปิด 04:00 น. ไทย รอ 1 ชั่วโมง → ตี 5 พอดี
    - cron: '0 22 * * 0-4'   # วันอาทิตย์-พฤหัส (ตี 5 วันจันทร์-ศุกร์)
    
    # ── ข่าวสาร 1 ทุ่ม (13:00 UTC): เตรียมก่อนตลาดเปิด ──
    - cron: '0 13 * * 1-5'
    
    # ── AI วิเคราะห์ 8 โมงเช้า (01:00 UTC): recommendations ──
    - cron: '0 1 * * 1-5'
    
    # ── ช่วงตลาดเปิด (20:30-04:00 น. ไทย = 13:30-21:00 UTC) ──
    # ดึงราคาทุก 10 นาที (ประหยัด quota กว่า 5 นาที แต่ fast enough)
    # 30 ตัว × 6 ครั้ง/ชม. × 7.5 ชม. = 1,350 req → ใช้ TD_KEY_2
    - cron: '*/10 14,15,16,17,18,19,20 * * 1-5'
    # ช่วง 13:30-14:00 (ตลาดเพิ่งเปิด)
    - cron: '30,40,50 13 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: auto / ticker / morning / news / close'
        required: false
        default: 'auto'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@3 firebase-admin

      - name: Run analysis
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: node scripts/analyze.js
