name: Auto Stock Analysis

on:
  schedule:
    # ── ตี 5 (22:00 UTC): เก็บราคาปิดตลาด US ──
    - cron: '0 22 * * 0-4'

    # ── 08:00 Bangkok (01:00 UTC): AI วิเคราะห์ + recommendations ──
    - cron: '0 1 * * 1-5'

    # ── 20:00 Bangkok (13:00 UTC): ข่าวสาร 1 ทุ่ม ──
    - cron: '0 13 * * 1-5'

    # ── ช่วงตลาดเปิด: ทุก 20 นาที (13:30-21:00 UTC) ──
    # 30 ตัว × 3 ครั้ง/ชม. × 7.5 ชม. = 675 req ✅ ปลอดภัย
    - cron: '30,50 13 * * 1-5'
    - cron: '10,30,50 14,15,16,17,18,19 * * 1-5'
    - cron: '10,30,50 20 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: auto / ticker / morning / news / close'
        required: false
        default: 'auto'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@3 firebase-admin

      - name: Run analysis
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: node scripts/analyze.js
