name: Auto Stock Analysis

on:
  schedule:
    # 08:00 Bangkok = 01:00 UTC (วิเคราะห์ watchlist + recommendation + portfolios)
    - cron: '0 1 * * 1-5'
    # 21:00 Bangkok = 14:00 UTC (วิเคราะห์ portfolios อย่างเดียว)
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (auto = ตามเวลา, morning = watchlist+rec, evening = portfolios only)'
        required: false
        default: 'auto'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@3 firebase-admin

      - name: Run analysis
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/analyze.js
